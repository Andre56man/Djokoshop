services:
  - type: web
    name: djokoshop
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Djokoshop.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: djokoshop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false

databases:
  - name: djokoshop-db
