{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1 style="margin-bottom: 2rem; font-weight: 300; text-align: center;">Mot de passe oublié</h1>
        
        <p style="text-align: center; margin-bottom: 2rem; color: #ffffffff;">
            Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" name="email" id="email" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Envoyer le lien</button>
        </form>
        
        <div style="text-align: center; margin-top: 1rem;">
            <a href="{% url 'login' %}" style="color: orange;">Retour à la connexion</a>
        </div>
    </div>
</div>
{% endblock %}
