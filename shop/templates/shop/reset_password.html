{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1 style="margin-bottom: 2rem; font-weight: 300; text-align: center;">Réinitialiser le mot de passe</h1>
        
        <p style="text-align: center; margin-bottom: 2rem; color: #666;">
            Entrez votre nouveau mot de passe ci-dessous.
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="password">Nouveau mot de passe</label>
                <input type="password" name="password" id="password" required>
                <small style="color: #666;">Minimum 8 caractères</small>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" name="confirm_password" id="confirm_password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Réinitialiser le mot de passe</button>
        </form>
    </div>
</div>
{% endblock %}
