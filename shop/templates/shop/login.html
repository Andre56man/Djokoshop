{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1 style="margin-bottom: 2rem; font-weight: 300; text-align: center;">Connexion</h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" name="username" id="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" name="password" id="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
        </form>
        
        <p style="text-align: center; margin-top: 1rem;">
            Pas encore de compte? <a href="{% url 'register' %}" style="color:orange;">Inscrivez-vous</a>
        </p>
        
        <div style="text-align: center; margin-top: 1rem;">
            <a href="{% url 'forgot_password' %}" style="color: orange;">Mot de passe oublié?</a>
        </div>
    </div>
</div>
{% endblock %}
